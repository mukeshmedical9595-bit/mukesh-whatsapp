<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mukesh Medical — MUKCARE Dashboard</title>
<style>
  :root{--g:#128C7E;--gd:#075E54;--bg:#f0f2f5;--in:#fff;--out:#d9fdd3;--bd:#e2e5e9;--muted:#667781}
  *{box-sizing:border-box;font-family:system-ui,Segoe UI,Roboto,sans-serif}
  body{margin:0;background:var(--bg);color:#111;height:100vh;overflow:hidden}
  header{background:var(--gd);color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:17px;margin:0;font-weight:600}
  header .r{display:flex;align-items:center;gap:12px}
  .pill{font-size:12px;padding:4px 10px;border-radius:20px;background:#ffffff22}
  .pill.ok{background:#25D36633}
  .btn{background:#ffffff22;color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
  .btn:hover{background:#ffffff33}
  .wrap{display:flex;height:calc(100vh - 48px)}

  /* conversation list */
  .list{width:330px;border-right:1px solid var(--bd);display:flex;flex-direction:column;background:#fff}
  .search{padding:8px 10px;border-bottom:1px solid var(--bd)}
  .search input{width:100%;padding:8px 12px;border:1px solid var(--bd);border-radius:18px;font-size:13px}
  .tabs{display:flex;gap:4px;padding:6px 10px;border-bottom:1px solid var(--bd);flex-wrap:wrap}
  .tab{font-size:12px;padding:5px 10px;border-radius:14px;background:#f0f2f5;cursor:pointer;color:#444}
  .tab.active{background:var(--g);color:#fff}
  .convs{overflow-y:auto;flex:1}
  .conv{padding:11px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .conv:hover{background:#f7f7f7}
  .conv.active{background:#eafaf1}
  .conv .top{display:flex;justify-content:space-between;align-items:baseline}
  .conv .n{font-weight:600;font-size:14px}
  .conv .time{font-size:11px;color:var(--muted);white-space:nowrap}
  .conv .p{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .badges{display:flex;gap:4px;margin-top:2px;flex-wrap:wrap}
  .badge{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:600}
  .badge.booked{background:#25D36622;color:#0a7d4b}
  .badge.pause{background:#ffb02033;color:#8a6100}
  .badge.spam{background:#ff4d4d22;color:#b00020}

  /* chat */
  .chat{flex:1;display:flex;flex-direction:column;min-width:0}
  .chead{padding:9px 16px;border-bottom:1px solid var(--bd);background:#fff;display:flex;justify-content:space-between;align-items:center}
  .chead .n{font-weight:600}
  .chead .s{font-size:12px;color:var(--muted)}
  .banner{background:#fff4d6;color:#8a6100;font-size:12px;padding:6px 16px;border-bottom:1px solid #f0e3b8}
  .msgs{flex:1;overflow-y:auto;padding:18px;background:#e5ddd5}
  .b{max-width:68%;padding:7px 11px;border-radius:8px;margin:5px 0;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px #0001;font-size:14px}
  .b.in{background:var(--in)}
  .b.out{background:var(--out);margin-left:auto}
  .b.bot{background:#dcf0ff}
  .b .t{font-size:10px;color:#8a8a8a;margin-top:3px;text-align:right}
  .composer{display:flex;padding:10px;background:#f0f2f5;border-top:1px solid var(--bd);gap:8px}
  .composer input{flex:1;padding:10px 14px;border:1px solid #ccc;border-radius:20px;font-size:14px}
  .composer button{background:var(--g);color:#fff;border:0;border-radius:20px;padding:10px 20px;cursor:pointer;font-size:14px}
  .empty{margin:auto;text-align:center;color:#777;padding:40px}

  /* profile panel */
  .prof{width:290px;border-left:1px solid var(--bd);background:#fff;overflow-y:auto;padding:16px}
  .prof h3{margin:0 0 2px;font-size:15px}
  .prof .ph{color:var(--muted);font-size:13px;margin-bottom:14px}
  .prof label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:12px 0 4px}
  .prof input[type=text],.prof textarea{width:100%;padding:8px 10px;border:1px solid var(--bd);border-radius:6px;font-size:13px}
  .prof textarea{resize:vertical;min-height:64px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid #f2f2f2}
  .row .lab{font-size:13px}
  .row .sub{font-size:11px;color:var(--muted)}
  .switch{position:relative;width:40px;height:22px;flex:0 0 auto}
  .switch input{opacity:0;width:0;height:0}
  .slider{position:absolute;inset:0;background:#ccc;border-radius:22px;cursor:pointer;transition:.2s}
  .slider:before{content:"";position:absolute;height:16px;width:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
  .switch input:checked+.slider{background:var(--g)}
  .switch input:checked+.slider:before{transform:translateX(18px)}
  .stat{display:flex;justify-content:space-between;font-size:12px;color:#444;padding:3px 0}
  .save{margin-top:6px;background:var(--g);color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-size:13px}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:50}
  .modal{background:#fff;border-radius:10px;padding:22px;width:560px;max-width:92vw}
  .modal h2{margin:0 0 6px;font-size:18px}
  .modal p{color:#555;font-size:13px;margin:0 0 12px}
  .modal textarea{width:100%;min-height:260px;padding:12px;border:1px solid var(--bd);border-radius:8px;font-size:13px;font-family:inherit;resize:vertical}
  .modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
  .modal .foot button{border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-size:14px}
  .modal .cancel{background:#eee}
  .modal .ok{background:var(--g);color:#fff}

  /* connect screen */
  .connect{padding:40px;text-align:center;margin:auto}
  .connect h2{margin:0 0 8px}
  .connect p{color:#555;max-width:520px;margin:8px auto 20px}
  .connect button{background:var(--g);color:#fff;border:0;border-radius:20px;padding:12px 22px;cursor:pointer;font-size:15px}
  .note{font-size:12px;color:#888;margin-top:14px}
</style>
</head>
<body>
<header>
  <h1>Mukesh Medical · MUKCARE</h1>
  <div class="r">
    <button class="btn" onclick="openTrain()">🎓 Train MUKCARE</button>
    <span id="status" class="pill">checking…</span>
  </div>
</header>

<div id="app"></div>

<!-- Train MUKCARE modal -->
<div class="modal-bg" id="trainBg">
  <div class="modal">
    <h2>Train MUKCARE</h2>
    <p>These instructions are given to MUKCARE for <b>every</b> customer chat. Add store rules, tone, do's and don'ts, current offers, items you're out of, etc. Plain language is fine.</p>
    <textarea id="trainTxt" placeholder="e.g. Always greet politely. We are closed on Sundays. Do not promise home delivery beyond 15 km. Current offer: 10% off on health supplements this week…"></textarea>
    <div class="foot">
      <button class="cancel" onclick="closeTrain()">Cancel</button>
      <button class="ok" onclick="saveTrain()">Save instructions</button>
    </div>
  </div>
</div>

<script>
let CFG=null, active=null, cache={}, filter='all', search='';

async function boot(){
  CFG = await (await fetch('/config')).json();
  setStatus();
  if(!CFG.connected){ renderConnect(); }
  else { renderInbox(); refresh(); setInterval(refresh, 5000); }
}
function setStatus(){
  const s=document.getElementById('status');
  s.textContent = CFG.connected ? (CFG.persistent?'Connected · Saved':'Connected') : 'Not connected';
  s.className = 'pill' + (CFG.connected?' ok':'');
}

/* ---------- inbox ---------- */
function renderInbox(){
  document.getElementById('app').innerHTML = `
    <div class="wrap">
      <div class="list">
        <div class="search"><input id="q" placeholder="Search name or number…" oninput="onSearch(this.value)"/></div>
        <div class="tabs">
          ${['all','unbooked','booked','spam'].map(t=>`<div class="tab ${filter===t?'active':''}" onclick="setFilter('${t}')">${({all:'All',unbooked:'Not booked',booked:'Booked',spam:'Spam'})[t]}</div>`).join('')}
        </div>
        <div class="convs" id="convs"></div>
      </div>
      <div class="chat" id="chat"><div class="empty">Select a conversation</div></div>
      <div class="prof" id="prof" style="display:none"></div>
    </div>`;
}
function onSearch(v){ search=v.toLowerCase(); renderList(); }
function setFilter(f){ filter=f; renderInbox(); const q=document.getElementById('q'); if(q){q.value=search;} renderList(); if(active) renderChat(active); }

async function refresh(){
  try{
    const d = await (await fetch('/api/messages')).json();
    if(d.persistent!==undefined && CFG){ CFG.persistent=d.persistent; setStatus(); }
    cache={}; (d.conversations||[]).forEach(c=>cache[c.waId]=c);
    renderList();
    if(active && cache[active]) renderChatUpdate(active);
  }catch(e){ /* keep last view */ }
}

function passFilter(c){
  if(filter==='booked') return c.booked;
  if(filter==='unbooked') return !c.booked && !c.spam;
  if(filter==='spam') return c.spam;
  return true; // all
}
function renderList(){
  const el=document.getElementById('convs'); if(!el) return;
  const items = Object.values(cache)
    .filter(passFilter)
    .filter(c=> !search || (c.name||'').toLowerCase().includes(search) || (c.waId||'').includes(search))
    .sort((a,b)=>(b.updated||0)-(a.updated||0));
  el.innerHTML = items.map(c=>{
    const last=c.messages[c.messages.length-1];
    return `<div class="conv ${active===c.waId?'active':''}" onclick="open_('${c.waId}')">
      <div class="top"><span class="n">${esc(c.name)}</span><span class="time">${last?shortTime(last.ts):''}</span></div>
      <div class="p">${last?esc(last.dir==='out'?'✓ '+last.text:last.text):''}</div>
      <div class="badges">
        ${c.booked?'<span class="badge booked">Booked</span>':''}
        ${c.humanControl?'<span class="badge pause">MUKCARE off</span>':''}
        ${c.spam?'<span class="badge spam">Spam</span>':''}
      </div>
    </div>`;
  }).join('') || '<div class="empty">No conversations</div>';
}

function open_(id){ active=id; renderList(); renderChat(id); renderProfile(id); }

function msgClass(m){ if(m.dir==='in') return 'in'; return m.bot?'bot':'out'; }
function renderChat(id){
  const c=cache[id]; const chat=document.getElementById('chat'); if(!c||!chat) return;
  const paused=c.humanControl;
  chat.innerHTML = `
    <div class="chead">
      <div><div class="n">${esc(c.name)}</div><div class="s">+${esc(c.waId)}</div></div>
    </div>
    ${paused?'<div class="banner">🙋 Human control is ON — MUKCARE is paused for this chat. Your replies go directly.</div>':''}
    <div class="msgs" id="msgs">${renderMsgs(c)}</div>
    <div class="composer">
      <input id="txt" placeholder="Type a reply…" onkeydown="if(event.key==='Enter')send()" autocomplete="off"/>
      <button onclick="send()">Send</button>
    </div>`;
  const m=document.getElementById('msgs'); m.scrollTop=m.scrollHeight;
  const t=document.getElementById('txt'); if(t) t.focus();
}
function renderMsgs(c){
  return c.messages.map(m=>`<div class="b ${msgClass(m)}">${esc(m.text)}<div class="t">${new Date(m.ts).toLocaleString()} ${m.dir==='out'?(m.status||''):''}</div></div>`).join('');
}
// update messages without stealing the composer text/focus
function renderChatUpdate(id){
  const c=cache[id]; const box=document.getElementById('msgs'); if(!box) return;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = renderMsgs(c);
  if(atBottom) box.scrollTop=box.scrollHeight;
  // refresh banner state if human-control changed
  const chat=document.getElementById('chat');
  const hasBanner=!!chat.querySelector('.banner');
  if(c.humanControl!==hasBanner) renderChat(id);
}

async function send(){
  const t=document.getElementById('txt'); const text=(t.value||'').trim(); if(!text||!active) return; t.value='';
  const r=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:active,text})});
  if(!r.ok){ alert('Send failed: '+JSON.stringify(await r.json())); }
  refresh();
}

/* ---------- profile panel ---------- */
function renderProfile(id){
  const c=cache[id]; const p=document.getElementById('prof'); if(!c||!p) return;
  p.style.display='block';
  const count=c.messages.length;
  const first=c.messages[0]?c.messages[0].ts:c.created;
  p.innerHTML = `
    <h3>Customer profile</h3>
    <label>Name</label>
    <input type="text" id="pname" value="${esc(c.name)}"/>
    <div class="ph" style="margin-top:6px">+${esc(c.waId)}</div>

    <div class="row">
      <div><div class="lab">Booked</div><div class="sub">Order confirmed for this customer</div></div>
      <label class="switch"><input type="checkbox" ${c.booked?'checked':''} onchange="flag('${id}','booked',this.checked)"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><div class="lab">MUKCARE auto-reply</div><div class="sub">Off = you handle this chat manually</div></div>
      <label class="switch"><input type="checkbox" ${c.humanControl?'':'checked'} onchange="flag('${id}','human_control',!this.checked)"><span class="slider"></span></label>
    </div>
    <div class="row">
      <div><div class="lab">Mark as spam</div><div class="sub">Idle chatter / spammer</div></div>
      <label class="switch"><input type="checkbox" ${c.spam?'checked':''} onchange="flag('${id}','spam',this.checked)"><span class="slider"></span></label>
    </div>

    <label>Agent notes</label>
    <textarea id="pnote" placeholder="Private notes about this customer…">${esc(c.note||'')}</textarea>
    <button class="save" onclick="saveProfile('${id}')">Save profile</button>

    <label style="margin-top:16px">Activity</label>
    <div class="stat"><span>Messages</span><span>${count}</span></div>
    <div class="stat"><span>First seen</span><span>${first?new Date(first).toLocaleDateString():'—'}</span></div>
    <div class="stat"><span>Last active</span><span>${c.updated?shortTime(c.updated):'—'}</span></div>
  `;
}
async function flag(id, field, value){
  await fetch('/api/contact/'+encodeURIComponent(id)+'/flag',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({field,value})});
  if(cache[id]){ cache[id][field==='human_control'?'humanControl':field]=value; }
  renderList(); if(active===id){ renderChat(id); renderProfile(id); }
}
async function saveProfile(id){
  const name=document.getElementById('pname').value.trim();
  const note=document.getElementById('pnote').value;
  await fetch('/api/contact/'+encodeURIComponent(id),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,note})});
  if(cache[id]){ cache[id].name=name; cache[id].note=note; }
  renderList();
  flash('Saved');
}

/* ---------- Train MUKCARE ---------- */
async function openTrain(){
  document.getElementById('trainBg').style.display='flex';
  try{ const s=await (await fetch('/api/settings')).json(); document.getElementById('trainTxt').value=s.trainInstructions||''; }catch(e){}
}
function closeTrain(){ document.getElementById('trainBg').style.display='none'; }
async function saveTrain(){
  const v=document.getElementById('trainTxt').value;
  await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({trainInstructions:v})});
  closeTrain(); flash('MUKCARE instructions saved');
}

/* ---------- helpers ---------- */
function flash(msg){
  const d=document.createElement('div');
  d.textContent=msg;
  d.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#075E54;color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-size:14px';
  document.body.appendChild(d); setTimeout(()=>d.remove(),1600);
}
function shortTime(ts){
  const d=new Date(ts), now=new Date();
  if(d.toDateString()===now.toDateString()) return d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  return d.toLocaleDateString([], {day:'2-digit',month:'short'});
}
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

/* ---------- connect (coexistence) ---------- */
function renderConnect(){
  document.getElementById('app').innerHTML = `
    <div class="wrap"><div class="connect">
      <h2>Connect your WhatsApp number (Coexistence)</h2>
      <p>This links <b>Mukesh Medical</b>'s WhatsApp Business app number to the Cloud API <b>without disconnecting the app</b>.</p>
      <button onclick="launchSignup()">Connect via Coexistence</button>
      <p class="note">Make sure the WhatsApp Business app on the phone is updated before scanning.</p>
    </div></div>`;
}
let sessionInfo={};
window.addEventListener('message',(event)=>{
  try{ if(!/facebook\.com$/.test(new URL(event.origin).hostname)) return;
    const data=JSON.parse(event.data);
    if(data.type==='WA_EMBEDDED_SIGNUP'){ sessionInfo=data.data||{}; }
  }catch(e){}
});
function launchSignup(){
  if(!window.FB){ alert('Facebook SDK still loading, try again in a moment.'); return; }
  try{ FB.init({appId:CFG.appId, version:CFG.graphVersion||'v21.0', xfbml:false}); }catch(e){}
  FB.login(function(response){
    const code = response?.authResponse?.code;
    if(!code){ alert('Sign-up cancelled or no code returned.'); return; }
    fetch('/api/session',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({code, phone_number_id:sessionInfo.phone_number_id, waba_id:sessionInfo.waba_id})})
      .then(r=>r.json()).then(j=>{ if(j.ok){ location.reload(); } else alert('Setup error: '+JSON.stringify(j)); });
  },{ config_id: CFG.configId, response_type:'code', override_default_response_type:true,
      extras:{ setup:{}, featureType:'whatsapp_business_app_onboarding', sessionInfoVersion:'3' } });
}
(function(){ fetch('/config').then(r=>r.json()).then(c=>{
  window.fbAsyncInit=function(){ FB.init({appId:c.appId, version:c.graphVersion||'v21.0', xfbml:false}); };
  const s=document.createElement('script'); s.async=true; s.defer=true; s.crossOrigin='anonymous';
  s.src='https://connect.facebook.net/en_US/sdk.js'; document.body.appendChild(s);
}); })();

boot();
</script>
</body>
</html>
